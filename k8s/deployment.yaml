apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp141-api
  labels:
    app: mp141-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mp141-api
  template:
    metadata:
      labels:
        app: mp141-api
    spec:
      containers:
      - name: mp141-api
        image: mp141-api:1.0
        ports:
        - containerPort: 8000
        env:
        - name: PORT
          value: "8000"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 15
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
